version: '3.8'

services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend FastAPI Server
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - QDRANT_URL=http://qdrant:6333
      - APP_ENV=development
    depends_on:
      qdrant:
        condition: service_healthy
    env_file:
      - .env

  # Dashboard (Streamlit)
  dashboard:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - backend
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  qdrant_data:
